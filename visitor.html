<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DirectConnect — Chat with Us</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <div id="auth-view" class="flex-1 flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
      <div class="bg-gradient-to-br from-indigo-600 to-violet-600 px-6 py-7 text-white text-center">
        <div class="w-12 h-12 rounded-xl bg-white/15 flex items-center justify-center mx-auto mb-3 border border-white/20">
          <i data-lucide="message-circle" class="w-6 h-6 text-white"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">DirectConnect</h1>
        <p class="text-indigo-100 text-sm mt-1">Message the site owner directly &amp; securely</p>
      </div>

      <div id="auth-tabs" class="grid grid-cols-2 border-b border-slate-200 bg-slate-50/70">
        <button id="tab-login" type="button" class="py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white">Sign In</button>
        <button id="tab-register" type="button" class="py-3 text-sm font-medium text-slate-500 hover:text-slate-800 border-b-2 border-transparent">Create Account</button>
      </div>

      <form id="login-form" class="p-6 space-y-4">
        <div>
          <label for="login-username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
          <input id="login-username" type="text" required placeholder="Enter your username" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500">Password</label>
            <button id="btn-show-forgot" type="button" class="text-xs font-semibold text-indigo-600 hover:underline">Forgot Password?</button>
          </div>
          <input id="login-password" type="password" required placeholder="Enter your password" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-indigo-500" />
        </div>
        <p id="login-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl">Sign In</button>
      </form>

      <form id="register-form" class="hidden p-6 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="reg-username" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Username *</label>
            <input id="reg-username" type="text" required placeholder="e.g. rahul_k" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          </div>
          <div>
            <label for="reg-displayname" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Display Name</label>
            <input id="reg-displayname" type="text" placeholder="Rahul Kumar" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="reg-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Password *</label>
            <input id="reg-password" type="password" required placeholder="Min 4 chars" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          </div>
          <div>
            <label for="reg-confirm" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Confirm *</label>
            <input id="reg-confirm" type="password" required placeholder="Repeat password" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          </div>
        </div>
        <div>
          <label for="reg-question" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Security Question *</label>
          <select id="reg-question" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl">
            <option value="What is your favorite food?">What is your favorite food?</option>
            <option value="What city were you born in?">What city were you born in?</option>
            <option value="What is your pet's name?">What is your pet's name?</option>
            <option value="What was the name of your first school?">What was the name of your first school?</option>
          </select>
        </div>
        <div>
          <label for="reg-answer" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5">Security Answer *</label>
          <input id="reg-answer" type="text" required placeholder="Used for Forgot Password" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        </div>
        <p id="reg-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-xl">Create Account &amp; Start Chat</button>
      </form>

      <div id="forgot-view" class="hidden p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-base font-bold text-slate-900">Reset Password</h2>
          <button id="btn-back-login" type="button" class="text-xs font-semibold text-slate-500 hover:text-slate-800">Back</button>
        </div>
        <form id="forgot-step1" class="space-y-3">
          <input id="forgot-username" type="text" required placeholder="Enter your username" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          <p id="forgot-step1-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
          <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 text-white text-sm font-semibold rounded-xl">Find Account</button>
        </form>
        <form id="forgot-step2" class="hidden space-y-3">
          <p id="forgot-question-text" class="text-sm font-medium text-slate-800 bg-indigo-50 p-3 rounded-xl"></p>
          <input id="forgot-answer" type="text" required placeholder="Your security answer" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          <input id="forgot-new-pw" type="password" required placeholder="New password (min 4 chars)" class="w-full px-3.5 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
          <p id="forgot-step2-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
          <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 text-white text-sm font-semibold rounded-xl">Reset Password &amp; Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <div id="chat-view" class="hidden flex-1 flex flex-col h-screen max-h-screen">
    <header class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between gap-3 shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shrink-0">
          <i data-lucide="message-square" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-base font-bold text-slate-900 truncate">Site Owner Support</h1>
          <p class="text-xs text-slate-500 truncate">Signed in as <span id="header-user-name" class="font-semibold text-slate-700"></span></p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-open-settings" type="button" class="px-3 py-2 text-xs sm:text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl">Change Password</button>
        <button id="btn-logout" type="button" class="px-3 py-2 text-xs sm:text-sm font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl">Sign Out</button>
      </div>
    </header>

    <main id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 max-w-4xl w-full mx-auto"></main>

    <footer class="bg-white border-t border-slate-200 px-4 sm:px-6 py-3 shrink-0">
      <form id="message-form" class="max-w-4xl mx-auto flex items-end gap-2.5">
        <textarea id="message-input" rows="1" placeholder="Write a message to the site owner..." class="flex-1 px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-2xl resize-none focus:outline-none focus:border-indigo-500"></textarea>
        <button type="submit" class="h-10 px-5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-2xl">Send</button>
      </form>
    </footer>
  </div>

  <div id="settings-modal" class="hidden fixed inset-0 z-40 bg-slate-900/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold">Change Password</h2>
        <button id="btn-close-settings" type="button" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <form id="change-pw-form" class="space-y-3">
        <input id="cp-current" type="password" required placeholder="Current password" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <input id="cp-new" type="password" required placeholder="New password (min 4 chars)" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <p id="cp-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl">Update Password</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const SESSION_KEY = 'dc_connected_visitor';
      let currentUser = null;
      let pollTimer = null;
      let forgotTarget = null;

      try { currentUser = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) {}

      function setSession(u) {
        currentUser = u;
        try {
          if (u) localStorage.setItem(SESSION_KEY, JSON.stringify(u));
          else localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
      }

      function showToast(msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      async function api(url, body) {
        const res = await fetch(url, body ? {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        } : undefined);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatTime(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        } catch (e) { return ''; }
      }

      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const forgotView = document.getElementById('forgot-view');
      const authTabs = document.getElementById('auth-tabs');

      function switchAuth(mode) {
        loginForm.classList.toggle('hidden', mode !== 'login');
        registerForm.classList.toggle('hidden', mode !== 'register');
        forgotView.classList.toggle('hidden', mode !== 'forgot');
        authTabs.classList.toggle('hidden', mode === 'forgot');
        tabLogin.className = mode === 'login' ? 'py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'py-3 text-sm font-medium text-slate-500 border-b-2 border-transparent';
        tabRegister.className = mode === 'register' ? 'py-3 text-sm font-semibold text-indigo-600 border-b-2 border-indigo-600 bg-white' : 'py-3 text-sm font-medium text-slate-500 border-b-2 border-transparent';
      }

      tabLogin.addEventListener('click', () => switchAuth('login'));
      tabRegister.addEventListener('click', () => switchAuth('register'));
      document.getElementById('btn-show-forgot').addEventListener('click', () => switchAuth('forgot'));
      document.getElementById('btn-back-login').addEventListener('click', () => switchAuth('login'));

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('login-error');
        try {
          const data = await api('/api/login', {
            username: document.getElementById('login-username').value,
            password: document.getElementById('login-password').value
          });
          err.classList.add('hidden');
          setSession(data.user);
          renderApp();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('reg-error');
        const pw = document.getElementById('reg-password').value;
        if (pw !== document.getElementById('reg-confirm').value) {
          err.textContent = 'Passwords do not match.';
          err.classList.remove('hidden');
          return;
        }
        try {
          const data = await api('/api/register', {
            username: document.getElementById('reg-username').value,
            displayName: document.getElementById('reg-displayname').value,
            password: pw,
            securityQuestion: document.getElementById('reg-question').value,
            securityAnswer: document.getElementById('reg-answer').value
          });
          err.classList.add('hidden');
          setSession(data.user);
          renderApp();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      document.getElementById('forgot-step1').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('forgot-step1-error');
        try {
          const data = await api('/api/forgot-lookup', { username: document.getElementById('forgot-username').value });
          forgotTarget = data.username;
          document.getElementById('forgot-question-text').textContent = data.securityQuestion;
          document.getElementById('forgot-step1').classList.add('hidden');
          document.getElementById('forgot-step2').classList.remove('hidden');
          err.classList.add('hidden');
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      document.getElementById('forgot-step2').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('forgot-step2-error');
        try {
          const data = await api('/api/forgot-reset', {
            username: forgotTarget,
            securityAnswer: document.getElementById('forgot-answer').value,
            newPassword: document.getElementById('forgot-new-pw').value
          });
          err.classList.add('hidden');
          setSession(data.user);
          switchAuth('login');
          renderApp();
          showToast('Password reset!');
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      async function loadMessages() {
        if (!currentUser) return;
        try {
          const data = await api('/api/messages?username=' + encodeURIComponent(currentUser.username));
          const el = document.getElementById('chat-messages');
          if (data.messages.length === 0) {
            el.innerHTML = '<p class="text-center text-sm text-slate-400 my-12">Send a message below to reach the site owner.</p>';
            return;
          }
          el.innerHTML = data.messages.map(m => {
            const isV = m.sender === 'visitor';
            return `<div class="flex ${isV ? 'justify-end' : 'justify-start'}">
              <div class="max-w-[75%] px-4 py-2.5 rounded-2xl ${isV ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-800'}">
                ${!isV ? '<span class="text-[10px] font-bold uppercase text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">Owner</span>' : ''}
                <p class="text-sm whitespace-pre-wrap mt-0.5">${escapeHtml(m.text)}</p>
                <p class="text-[10px] opacity-70 mt-1">${formatTime(m.timestamp)}</p>
              </div>
            </div>`;
          }).join('');
          el.scrollTop = el.scrollHeight;
        } catch (e) {}
      }

      document.getElementById('message-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const inp = document.getElementById('message-input');
        const text = inp.value.trim();
        if (!text || !currentUser) return;
        await api('/api/messages', { username: currentUser.username, text });
        inp.value = '';
        await loadMessages();
      });

      document.getElementById('btn-logout').addEventListener('click', () => {
        setSession(null);
        renderApp();
      });

      document.getElementById('btn-open-settings').addEventListener('click', () => document.getElementById('settings-modal').classList.remove('hidden'));
      document.getElementById('btn-close-settings').addEventListener('click', () => document.getElementById('settings-modal').classList.add('hidden'));

      document.getElementById('change-pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('cp-error');
        try {
          await api('/api/change-password', {
            username: currentUser.username,
            currentPassword: document.getElementById('cp-current').value,
            newPassword: document.getElementById('cp-new').value
          });
          err.classList.add('hidden');
          e.target.reset();
          document.getElementById('settings-modal').classList.add('hidden');
          showToast('Password updated!');
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      function renderApp() {
        if (pollTimer) clearInterval(pollTimer);
        if (currentUser) {
          document.getElementById('auth-view').classList.add('hidden');
          document.getElementById('chat-view').classList.remove('hidden');
          document.getElementById('header-user-name').textContent = `${currentUser.displayName} (@${currentUser.username})`;
          loadMessages();
          pollTimer = setInterval(loadMessages, 2500);
        } else {
          document.getElementById('chat-view').classList.add('hidden');
          document.getElementById('auth-view').classList.remove('hidden');
        }
        if (window.lucide) lucide.createIcons();
      }

      renderApp();
    })();
  </script>
</body>
</html>
