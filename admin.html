<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DirectConnect — Private Owner Inbox</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <div id="owner-login-view" class="flex-1 flex items-center justify-center p-4 sm:p-6 bg-slate-950">
    <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 overflow-hidden">
      <div class="px-6 py-7 text-center border-b border-slate-800">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center mx-auto mb-3 text-emerald-400">
          <i data-lucide="shield" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold text-white">Owner Admin Portal</h1>
        <p class="text-slate-400 text-sm mt-1">Live connected inbox &amp; visitor management</p>
      </div>

      <form id="owner-login-form" class="p-6 space-y-4">
        <div>
          <label for="owner-user" class="block text-xs font-semibold uppercase text-slate-400 mb-1.5">Owner Username</label>
          <input id="owner-user" type="text" required placeholder="Enter owner username (default: owner)" class="w-full px-3.5 py-2.5 text-sm bg-slate-800 text-white border border-slate-700 rounded-xl" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="owner-pass" class="block text-xs font-semibold uppercase text-slate-400">Admin Password</label>
            <button id="btn-owner-forgot" type="button" class="text-xs font-semibold text-emerald-400 hover:underline">Forgot Username / Password?</button>
          </div>
          <input id="owner-pass" type="password" required placeholder="Enter admin password (default: 123)" class="w-full px-3.5 py-2.5 text-sm bg-slate-800 text-white border border-slate-700 rounded-xl" />
        </div>
        <p id="owner-login-error" class="hidden text-xs font-medium text-rose-400 bg-rose-950/60 border border-rose-800 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold rounded-xl">Unlock Private Inbox</button>
        <p class="text-[11px] text-slate-500 text-center">Default: <code class="text-slate-300">owner</code> / <code class="text-slate-300">123</code> (Recovery PIN: <code class="text-slate-300">1234</code>)</p>
      </form>

      <form id="owner-forgot-form" class="hidden p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-white">Reset Owner Credentials</h2>
          <button id="btn-owner-back-login" type="button" class="text-xs text-slate-400 hover:text-white">Back</button>
        </div>
        <input id="of-pin" type="password" required placeholder="Recovery PIN (default: 1234)" class="w-full px-3.5 py-2.5 text-sm bg-slate-800 text-white border border-slate-700 rounded-xl" />
        <input id="of-username" type="text" required placeholder="New Owner Username" class="w-full px-3.5 py-2.5 text-sm bg-slate-800 text-white border border-slate-700 rounded-xl" />
        <input id="of-password" type="password" required placeholder="New Admin Password" class="w-full px-3.5 py-2.5 text-sm bg-slate-800 text-white border border-slate-700 rounded-xl" />
        <p id="of-error" class="hidden text-xs font-medium text-rose-400 bg-rose-950/60 border border-rose-800 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2.5 px-4 bg-emerald-600 text-white text-sm font-semibold rounded-xl">Reset &amp; Unlock Inbox</button>
      </form>
    </div>
  </div>

  <div id="admin-view" class="hidden flex-1 flex flex-col h-screen max-h-screen">
    <header class="bg-slate-900 text-white px-4 sm:px-6 py-3 flex items-center justify-between gap-3 shrink-0 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
          <i data-lucide="inbox" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-sm sm:text-base font-bold">Owner Private Inbox <span id="total-unread-badge" class="hidden ml-2 px-2 py-0.5 rounded-full text-[11px] bg-emerald-500 text-slate-950"></span></h1>
          <p class="text-xs text-slate-400">Live connected to Visitor Portal</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-owner-settings" type="button" class="px-3 py-2 text-xs sm:text-sm font-medium text-slate-200 bg-slate-800 hover:bg-slate-700 rounded-xl">Settings</button>
        <button id="btn-owner-logout" type="button" class="px-3 py-2 text-xs sm:text-sm font-medium text-rose-300 bg-rose-950/60 hover:bg-rose-900/70 rounded-xl">Lock</button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <aside id="sidebar-panel" class="w-full md:w-80 lg:w-96 bg-white border-r border-slate-200 flex flex-col shrink-0">
        <div class="p-3 border-b border-slate-200 bg-slate-50/60">
          <input id="search-users" type="text" placeholder="Search visitors..." class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-xl" />
        </div>
        <div id="user-list" class="flex-1 overflow-y-auto divide-y divide-slate-100"></div>
      </aside>

      <section id="chat-panel" class="hidden md:flex flex-1 flex-col bg-slate-50 min-w-0">
        <div id="no-chat-selected" class="flex-1 flex items-center justify-center p-6 text-slate-400 text-sm">Select a visitor conversation from the left inbox.</div>
        <div id="active-chat-container" class="hidden flex-1 flex flex-col h-full">
          <div class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex items-center justify-between gap-3 shrink-0">
            <div class="flex items-center gap-3">
              <button id="btn-mobile-back" type="button" class="md:hidden p-1.5 text-slate-600"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
              <div>
                <h2 id="active-user-name" class="text-sm font-bold text-slate-900"></h2>
                <p id="active-user-meta" class="text-xs text-slate-500"></p>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button id="btn-clear-chat" type="button" class="px-2.5 py-1.5 text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-lg">Clear Chat</button>
            </div>
          </div>
          <div id="admin-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3"></div>
          <form id="admin-reply-form" class="bg-white border-t border-slate-200 px-4 sm:px-6 py-3 flex items-end gap-2.5 shrink-0">
            <textarea id="admin-reply-input" rows="1" placeholder="Write a reply as Owner..." class="flex-1 px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-2xl resize-none focus:outline-none focus:border-emerald-500"></textarea>
            <button type="submit" class="h-10 px-5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-2xl">Reply</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <div id="owner-settings-modal" class="hidden fixed inset-0 z-40 bg-slate-900/50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-base font-bold">Owner Username &amp; Password</h2>
        <button id="btn-close-owner-settings" type="button" class="p-1 text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <form id="owner-pw-form" class="space-y-3">
        <input id="opw-username" type="text" required placeholder="Owner Username" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <input id="opw-current" type="password" required placeholder="Current Admin Password *" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <input id="opw-new" type="password" placeholder="New Admin Password (optional)" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <input id="opw-pin" type="text" placeholder="Recovery PIN" class="w-full px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl" />
        <p id="opw-error" class="hidden text-xs font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
        <button type="submit" class="w-full py-2 bg-emerald-600 text-white text-sm font-semibold rounded-xl">Save Owner Credentials</button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const SESSION_KEY = 'dc_connected_owner';
      let unlocked = false;
      let selectedUsername = null;
      let inboxData = { users: [], messages: [] };
      let pollTimer = null;

      try { unlocked = localStorage.getItem(SESSION_KEY) === 'true'; } catch (e) {}

      function setUnlocked(v) {
        unlocked = v;
        try {
          if (v) localStorage.setItem(SESSION_KEY, 'true');
          else localStorage.removeItem(SESSION_KEY);
        } catch (e) {}
      }

      function showToast(msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        el.textContent = msg;
        document.getElementById('toast-container').appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }

      async function api(url, body) {
        const res = await fetch(url, body ? {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        } : undefined);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        return data;
      }

      function escapeHtml(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      function formatTime(iso) {
        try {
          const d = new Date(iso);
          return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.toLocaleDateString([], { month: 'short', day: 'numeric' });
        } catch (e) { return ''; }
      }

      document.getElementById('btn-owner-forgot').addEventListener('click', () => {
        document.getElementById('owner-login-form').classList.add('hidden');
        document.getElementById('owner-forgot-form').classList.remove('hidden');
      });

      document.getElementById('btn-owner-back-login').addEventListener('click', () => {
        document.getElementById('owner-forgot-form').classList.add('hidden');
        document.getElementById('owner-login-form').classList.remove('hidden');
      });

      document.getElementById('owner-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('owner-login-error');
        try {
          await api('/api/owner/login', {
            username: document.getElementById('owner-user').value,
            password: document.getElementById('owner-pass').value
          });
          err.classList.add('hidden');
          setUnlocked(true);
          renderDashboard();
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      document.getElementById('owner-forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('of-error');
        try {
          await api('/api/owner/forgot-reset', {
            pin: document.getElementById('of-pin').value,
            newUsername: document.getElementById('of-username').value,
            newPassword: document.getElementById('of-password').value
          });
          err.classList.add('hidden');
          setUnlocked(true);
          renderDashboard();
          showToast('Owner credentials reset!');
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      document.getElementById('btn-owner-logout').addEventListener('click', () => {
        setUnlocked(false);
        selectedUsername = null;
        renderDashboard();
      });

      document.getElementById('search-users').addEventListener('input', renderUserList);
      document.getElementById('btn-mobile-back').addEventListener('click', () => {
        document.getElementById('sidebar-panel').classList.remove('hidden');
        document.getElementById('chat-panel').classList.add('hidden');
      });

      async function fetchInbox() {
        if (!unlocked) return;
        try {
          inboxData = await api('/api/owner/inbox');
          renderUserList();
          renderActiveChat();
        } catch (e) {}
      }

      function renderUserList() {
        const q = document.getElementById('search-users').value.trim().toLowerCase();
        const listEl = document.getElementById('user-list');
        let totalUnread = 0;
        const enriched = inboxData.users.map(u => {
          const msgs = inboxData.messages.filter(m => m.username === u.username);
          const unread = msgs.filter(m => m.sender === 'visitor' && !m.readByOwner).length;
          totalUnread += unread;
          const last = msgs[msgs.length - 1];
          const sortTime = last ? new Date(last.timestamp).getTime() : new Date(u.createdAt || 0).getTime();
          return { user: u, unread, last, sortTime };
        }).sort((a, b) => b.sortTime - a.sortTime);

        const badge = document.getElementById('total-unread-badge');
        if (totalUnread > 0) {
          badge.textContent = `${totalUnread} unread`;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }

        const filtered = enriched.filter(i => !q || i.user.username.includes(q) || (i.user.displayName || '').toLowerCase().includes(q));
        if (filtered.length === 0) {
          listEl.innerHTML = '<div class="p-8 text-center text-sm text-slate-400">No visitor messages yet.</div>';
          return;
        }
        listEl.innerHTML = filtered.map(i => `
          <button type="button" data-username="${escapeHtml(i.user.username)}" class="w-full text-left px-4 py-3.5 hover:bg-slate-50 ${selectedUsername === i.user.username ? 'bg-emerald-50 border-l-4 border-l-emerald-600' : ''}">
            <div class="flex justify-between items-center">
              <p class="text-sm font-semibold text-slate-900">${escapeHtml(i.user.displayName || i.user.username)}</p>
              ${i.unread > 0 ? `<span class="px-1.5 py-0.5 text-[10px] font-bold bg-emerald-600 text-white rounded-full">${i.unread}</span>` : ''}
            </div>
            <p class="text-xs text-slate-500 truncate mt-0.5">${escapeHtml(i.last ? i.last.text : 'No messages yet')}</p>
          </button>
        `).join('');
      }

      function renderActiveChat() {
        const noChat = document.getElementById('no-chat-selected');
        const activeChat = document.getElementById('active-chat-container');
        if (!selectedUsername) {
          noChat.classList.remove('hidden');
          activeChat.classList.add('hidden');
          return;
        }
        const user = inboxData.users.find(u => u.username === selectedUsername);
        if (!user) return;
        noChat.classList.add('hidden');
        activeChat.classList.remove('hidden');
        document.getElementById('active-user-name').textContent = user.displayName || user.username;
        document.getElementById('active-user-meta').textContent = '@' + user.username;

        const msgs = inboxData.messages.filter(m => m.username === selectedUsername);
        const container = document.getElementById('admin-messages');
        container.innerHTML = msgs.map(m => {
          const isO = m.sender === 'owner';
          return `<div class="flex ${isO ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[75%] px-4 py-2.5 rounded-2xl ${isO ? 'bg-emerald-600 text-white' : 'bg-white border border-slate-200 text-slate-800'}">
              <p class="text-sm whitespace-pre-wrap">${escapeHtml(m.text)}</p>
              <p class="text-[10px] opacity-70 mt-1">${formatTime(m.timestamp)}</p>
            </div>
          </div>`;
        }).join('');
        container.scrollTop = container.scrollHeight;
      }

      document.getElementById('user-list').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-username]');
        if (!btn) return;
        selectedUsername = btn.getAttribute('data-username');
        await api('/api/owner/mark-read', { username: selectedUsername });
        if (window.innerWidth < 768) {
          document.getElementById('sidebar-panel').classList.add('hidden');
          document.getElementById('chat-panel').classList.remove('hidden');
          document.getElementById('chat-panel').classList.add('flex');
        }
        fetchInbox();
      });

      document.getElementById('admin-reply-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const inp = document.getElementById('admin-reply-input');
        const text = inp.value.trim();
        if (!text || !selectedUsername) return;
        await api('/api/owner/reply', { username: selectedUsername, text });
        inp.value = '';
        fetchInbox();
      });

      document.getElementById('btn-clear-chat').addEventListener('click', async () => {
        if (!selectedUsername) return;
        await api('/api/owner/clear-chat', { username: selectedUsername });
        fetchInbox();
        showToast('Chat cleared.');
      });

      document.getElementById('btn-owner-settings').addEventListener('click', () => {
        document.getElementById('opw-username').value = inboxData.ownerUsername || 'owner';
        document.getElementById('opw-pin').value = inboxData.ownerRecoveryPin || '1234';
        document.getElementById('owner-settings-modal').classList.remove('hidden');
      });

      document.getElementById('btn-close-owner-settings').addEventListener('click', () => {
        document.getElementById('owner-settings-modal').classList.add('hidden');
      });

      document.getElementById('owner-pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = document.getElementById('opw-error');
        try {
          await api('/api/owner/credentials', {
            newUsername: document.getElementById('opw-username').value,
            currentPassword: document.getElementById('opw-current').value,
            newPassword: document.getElementById('opw-new').value,
            newPin: document.getElementById('opw-pin').value
          });
          err.classList.add('hidden');
          e.target.reset();
          document.getElementById('owner-settings-modal').classList.add('hidden');
          showToast('Credentials updated!');
        } catch (ex) {
          err.textContent = ex.message;
          err.classList.remove('hidden');
        }
      });

      function renderDashboard() {
        if (pollTimer) clearInterval(pollTimer);
        if (unlocked) {
          document.getElementById('owner-login-view').classList.add('hidden');
          document.getElementById('admin-view').classList.remove('hidden');
          fetchInbox();
          pollTimer = setInterval(fetchInbox, 2500);
        } else {
          document.getElementById('admin-view').classList.add('hidden');
          document.getElementById('owner-login-view').classList.remove('hidden');
        }
        if (window.lucide) lucide.createIcons();
      }

      renderDashboard();
    })();
  </script>
</body>
</html>
